<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAMERS • Verifying Age</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { background: #0c0f14; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .card { max-width: 480px; background: #12161e; border-radius: 32px; padding: 2rem; text-align: center; border: 1px solid #2a2f3a; }
  .spinner { width: 48px; height: 48px; border: 4px solid #2a3f5e; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 1.5rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { color: #eef2ff; margin-bottom: 0.5rem; }
  p { color: #8f9bb5; }
  .status { color: #5fc3ff; margin-top: 1rem; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="card">
  <h2>Verifying age status</h2>
  <div class="spinner"></div>
  <p>Contacting Roblox servers...</p>
  <div class="status" id="status">Please wait</div>
</div>
<script>
  let dots = 0;
  const statusEl = document.getElementById('status');
  const messages = ["Fetching account data", "Checking birth date", "Bypassing age gate", "Updating verification status"];
  let step = 0;
  const interval = setInterval(() => {
    if (step < messages.length) {
      statusEl.innerText = messages[step] + ".".repeat((dots % 3) + 1);
      dots++;
      if (dots % 10 === 0) step++;
    } else {
      clearInterval(interval);
      statusEl.innerText = "Redirecting...";
      setTimeout(() => { window.location.href = "success.html"; }, 1000);
    }
  }, 1200);
</script>
</body>
</html>
